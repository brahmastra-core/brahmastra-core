[package]
name = "brahmastra_core_engine"
version = "0.5.0"
edition = "2021"

[lib]
name = "brahmastra_core_engine"
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "brahmastra_node"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
